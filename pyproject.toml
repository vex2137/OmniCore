[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omnicore"
version = "0.1.0a0"
description = "Local AI platform — headless foundation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
]

[project.scripts]
omnicore = "omnicore.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/omnicore"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S104", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["omnicore"]
