name: Native Android APK

on:
  push:
    branches: [main, feature/0.1.0-alpha, feature/android-part-2]
    paths: ['backend/src/omnicore/distribution.json', 'apps/android/**', '.github/workflows/android.yml', 'scripts/package_android.py', 'scripts/android_identity.py', 'scripts/test_android_emulator.sh']
  pull_request:
    paths: ['backend/src/omnicore/distribution.json', 'apps/android/**', '.github/workflows/android.yml', 'scripts/package_android.py', 'scripts/android_identity.py', 'scripts/test_android_emulator.sh']
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build with the owner's protected signing identity (not publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.signed_release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, Android lint and signed test APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Stage ARM64 test APK and checksum
        run: python3 scripts/package_android.py
      - name: Reject unsigned or debug Stable preparation
        if: matrix.api == 36
        working-directory: apps/android
        run: |
          if ./gradlew --no-daemon :app:assembleRelease > "$RUNNER_TEMP/release-refusal.log" 2>&1; then
            echo 'Unexpected release build without owner signing configuration'
            exit 1
          fi
          grep -F 'Release signing requires all OMNICORE_ANDROID signing variables' "$RUNNER_TEMP/release-refusal.log"
          cd ../..
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from android_identity import apk_identity, verify_release
          apk = Path('apps/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk')
          identity = apk_identity(apk, Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0')
          try:
              verify_release(identity, identity['certificate_sha256'], identity['application_id'])
          except ValueError:
              print('Actual debug APK rejected as release: PASS')
          else:
              raise SystemExit('Debug signing accepted as release')
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.api == 36
        with:
          name: OmniCore-android-arm64
          path: |
            dist/OmniCore-*-android-arm64.apk
            dist/OmniCore-*-android-arm64.apk.sha256
            dist/android-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for the native UI test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI, HTTP/SSE and Keystore tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/android
          script: bash ../../scripts/test_android_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports-api-${{ matrix.api }}
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
            dist/android-evidence
          retention-days: 14

  owner-signed-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore private signing material outside checkout
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Missing protected signing keystore; no debug fallback')
          data = base64.b64decode(encoded, validate=True)
          if not data or len(data) > 1024 * 1024:
              raise SystemExit('Invalid keystore size')
          path = Path(os.environ['RUNNER_TEMP']) / 'omnicore-release.p12'
          descriptor = os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(data)
          PY
      - name: Sign APK using the protected owner key
        working-directory: apps/android
        env:
          OMNICORE_ANDROID_KEYSTORE: ${{ runner.temp }}/omnicore-release.p12
          OMNICORE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          OMNICORE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          OMNICORE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          OMNICORE_ANDROID_RELEASE_ID: ${{ vars.ANDROID_RELEASE_APPLICATION_ID }}
          OMNICORE_ANDROID_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify pinned certificate, identity, ABI and alignment
        env:
          OMNICORE_ANDROID_RELEASE_ID: ${{ vars.ANDROID_RELEASE_APPLICATION_ID }}
          OMNICORE_ANDROID_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 scripts/package_android.py --release
      - name: Remove this job's temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/omnicore-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: OmniCore-owner-signed-android-arm64
          path: |
            dist/OmniCore-*-android-arm64.apk
            dist/OmniCore-*-android-arm64.apk.sha256
            dist/android-build.json
          if-no-files-found: error
          retention-days: 30
