name: Native Android APK

on:
  push:
    branches: [main, feature/0.1.0-alpha]
    paths: ['apps/android/**', '.github/workflows/android.yml', 'scripts/package_android.py']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml', 'scripts/package_android.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, Android lint and signed test APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Stage ARM64 test APK and checksum
        run: python3 scripts/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: OmniCore-0.1.0-alpha-android-arm64
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/android-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for the native UI test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI, HTTP/SSE and Keystore tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p ../../dist/android-evidence
            adb pull /sdcard/Android/data/io.github.vex2137.omnicore/files/evidence ../../dist/android-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
          retention-days: 14

  attach-draft:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/0.1.0-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OmniCore-0.1.0-alpha-android-arm64
          path: package
      - name: Attach tested APK only to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd package
          sha256sum -c OmniCore-0.1.0-alpha-android-arm64.apk.sha256
          draft=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v0.1.0-alpha.1") | .draft')
          test "$draft" = true
          gh release upload v0.1.0-alpha.1 OmniCore-0.1.0-alpha-android-arm64.apk OmniCore-0.1.0-alpha-android-arm64.apk.sha256 --clobber
