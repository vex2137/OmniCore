name: Native Android APK

on:
  push:
    branches: [main, feature/0.1.0-alpha, feature/android-part-2]
    paths: ['apps/android/**', '.github/workflows/android.yml', 'scripts/package_android.py']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml', 'scripts/package_android.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, Android lint and signed test APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Stage ARM64 test APK and checksum
        run: python3 scripts/package_android.py
      - uses: actions/upload-artifact@v4
        if: matrix.api == 36
        with:
          name: OmniCore-0.1.0-alpha-android-arm64
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/android-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for the native UI test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI, HTTP/SSE and Keystore tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/android
          script: |
            adb shell getconf PAGE_SIZE
            adb shell mkdir -p /sdcard/Download
            test_status=0
            ./gradlew --no-daemon connectedDebugAndroidTest || test_status=$?
            mkdir -p ../../dist/android-evidence
            adb pull /sdcard/Download/omnicore-android-chat.png ../../dist/android-evidence/android-chat.png || true
            adb pull /sdcard/Download/omnicore-android-failure.png ../../dist/android-evidence/android-failure.png || true
            exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports-api-${{ matrix.api }}
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
            dist/android-evidence
          retention-days: 14
